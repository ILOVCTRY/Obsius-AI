name: 分诊建档
goal: 样本归类与功能面初判，锁定分析优先级与研究路线
order: 1
focus:
  triage: 3
  analyze: 1
gate:
  min_assets: 1
  idle_rounds: 2
gate_types: [reconstruct]
tasks:
  - task_type: triage
    role: reverse-analyst
    objective: 对项目样本做分流建档：按格式/架构/混淆特征归类，登记资产并初判功能面，锁定分析优先级
    acceptance: 样本以 binary 资产登记入黑板，功能面初判与优先级落发现（intel）
next: [analyze]
