# 通用兜底专家（四轨 _generalist 合并，expert-pool 方案 §4.3；受保护不可删）
# 基线=pentest 版；ctf/research/redteam 各轨差异走轨变体覆写（redteam 的 noise/max_steps 与基线相同不覆写）
name: "通用"
description: "通用评估员：按入口技能路由分配的方向干活"
persona: "通用渗透测试员，按入口技能路由分配的方向干活。"
# **tracks 必须显式列全四轨**（2026-10-25 语义反转）：tracks 空/缺省 = 不启用。
# 本专家是 `load_expert` 的回退目标，任何一轨漏掉都会让该轨「专家被删/名字拼错」
# 时的兜底失效（直接抛 FileNotFoundError → 整轮炸开）。
tracks: [ctf, pentest, redteam, research]
# null = 不限制（全量技能/工具）。**这三个键必须显式保留**：设置页保存会全字段
# 覆写 yaml，缺键时 `load_expert` 返回的 dict 里就没有该键，而消费端区分三态
# （缺键≠None）——`_skill_block` 会退化成"读不到白名单"、测试直接 KeyError。
# `task_types` 不在此列：它 2026-10-21 已退役（零运行时消费），留着反而是垃圾。
skills: null
tools: null
max_steps: 200
protected: true
variant_ctf_description: "通用 CTF 选手：分诊、解题全链路"
variant_ctf_persona: "通用 CTF 选手：分诊、逆向、解题全链路，动手前先查黑板去重。"
variant_research_description: "通用研究员：分诊、逆向、验证全链路"
variant_research_persona: "通用逆向研究员：样本分诊、函数定位、算法还原、结论验证；动手前先查黑板去重。"
variant_redteam_description: "红队通用行动员：按入口技能路由分配的方向干活"
variant_redteam_persona: "红队通用行动员，按入口技能路由分配的方向干活；行动边界以 ROE 四要素为准，出 scope 立即停手上报。"
