          - generic [ref=f1e441]: "# POC: pkxss 管理后台入口门 302（鉴权面存在，未授权不可达） # 依据黑板 finding（find-a0642f25fe72）evidence 重建（原 Agent 报了 .ps1 路径但未落盘； # 按 §5.2 约定 POC 脚本仅限 Python，故重建为 .py）。 # 用法: python poc_pkxss_entry_gate_302.py （靶标: http://127.0.0.1:8085，仅限本地授权靶机） import urllib.error import urllib.request BASE = \"http://127.0.0.1:8085\" def probe(path: str, note: str) -> None: req = urllib.request.Request(BASE + path, method=\"GET\") opener = urllib.request.build_opener(NoRedirect()) try: r = opener.open(req, timeout=5) print(f\"[{path}] {r.status}（{note}）\") except urllib.error.HTTPError as e: loc = e.headers.get(\"Location\", \"-\") print(f\"[{path}] {e.code} location: {loc} （{note}）\") class NoRedirect(urllib.request.HTTPRedirectHandler): def redirect_request(self, *a, **k): # 不跟随跳转，观察原始状态码 return None probe(\"/pkxss/index.php\", \"期望 302 弹回登录门（访问控制存在）\") probe(\"/pkxss/pkxss_admin.php\", \"期望 404（后台子页不可枚举）\") probe(\"/pkxss/inc/\", \"期望 404（目录列表关闭）\") print(\"[结论] 302→登录门 + 子页 404 → 访问控制面存在，未授权可达性不成立\")"
