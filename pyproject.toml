[project]
name = "obsius"
version = "0.1.0"
description = "AI 驱动的全能安全平台（渗透/红队/CTF/逆向/Pwn/IoT/AI 安全），原生 Windows 优先"
readme = "DESIGN.md"
requires-python = ">=3.11"
# LLM 接入层（core/llm，2026-10-03 SDK 迁移）以官方 anthropic/openai SDK 为主引擎，
# httpx 传输垫片负责原始字节旁路录制。这三件套在模块导入期即需要，故落核心依赖
# ——core/llm 之外的 core 子系统仍保持零依赖。
dependencies = ["anthropic>=0.40", "openai>=1.40", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# API 层额外依赖（唯一 import fastapi 的地方是 core/api/）
# openpyxl：资产批量导入 xlsx 解析（cyberspace-mapping M1；缺失 503 降级，CSV 恒可用）
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1", "py7zr>=0.21"]
# 浏览器能力（F6，DESIGN.md §7）：Playwright 托管 Chromium + httpx 重放/爆破客户端。
# 未安装时 core/browser 全链 no-tool 降级（import 不炸、工具回填安装指引、端点 503）
browser = ["playwright>=1.45"]
# 桌面窗口壳（desktop-app-shell，DESIGN.md §1）：serve.py --window 的 pywebview 依赖，
# 仅 --window 分支 import；未安装时回退无窗模式（打印安装指引）
window = ["pywebview>=5.0"]
# token 分层计数（core/llm/tokenizer.py）：OpenAI 系走 tiktoken 真精确，其余走
# 校准估算器。缺失时静默降级到估算器，不影响功能。
tokens = ["tiktoken>=0.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.blackboard", "core.browser"]
