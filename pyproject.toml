[project]
name = "obsius"
version = "0.1.0"
description = "AI 驱动的全能安全平台（渗透/红队/CTF/逆向/Pwn/IoT/AI 安全），原生 Windows 优先"
readme = "DESIGN.md"
requires-python = ">=3.11"
# LLM 接入层（core/llm，2026-10-03 SDK 迁移）以官方 anthropic/openai SDK 为主引擎，
# httpx 传输垫片负责原始字节旁路录制。这三件套在模块导入期即需要，故落核心依赖
# ——core/llm 之外的 core 子系统仍保持零依赖。
dependencies = ["anthropic>=0.40", "openai>=1.40", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# API 层额外依赖（唯一 import fastapi 的地方是 core/api/）
# openpyxl：资产批量导入 xlsx 解析（cyberspace-mapping M1；缺失 503 降级，CSV 恒可用）
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1", "py7zr>=0.21"]
# 浏览器能力（F6，DESIGN.md §7）：Playwright 托管 Chromium + httpx 重放/爆破客户端。
# 未安装时 core/browser 全链 no-tool 降级（import 不炸、工具回填安装指引、端点 503）
browser = ["playwright>=1.45"]
# 联网搜索（web_search 工具，core/websearch.py）：SearXNG 自建主后端零依赖（httpx 即可），
# ddgs 免 Key 直连 DuckDuckGo 备用后端。缺失时 web_search 仅 SearXNG 可用/或回填
# 安装指引，import 不炸、绝不 500。
websearch = ["ddgs>=9.0"]
# 桌面窗口壳（desktop-app-shell，DESIGN.md §1）：serve.py --window 的 pywebview 依赖，
# 仅 --window 分支 import；未安装时回退无窗模式（打印安装指引）
window = ["pywebview>=5.0"]
# token 分层计数（core/llm/tokenizer.py）：OpenAI 系走 tiktoken 真精确，其余走
# 校准估算器。缺失时静默降级到估算器，不影响功能。
tokens = ["tiktoken>=0.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 分层标记（2026-10-24 回归提速）。**默认不排除任何用例**——`pytest tests/` 仍是
# 全量真跑。快速回路走 `scripts/test_regress.py quick`（见该脚本头注释）。
# 刻意不设 `addopts = "-m 'not slow'"`：默认静默少跑一批用例 = 假绿，本仓明令禁止。
markers = [
  "slow: 单用例 >2s（多为真实文件系统/子进程 IO）；quick 模式排除",
  "e2e: 需真实浏览器/容器/外部服务；quick 模式排除",
  "net: 需外网或真实代理链路；无网环境可 -m 'not net'",
  "serial: 不可与其他用例并行（Windows 文件系统边界：junction/reparse/只读位/尾点名）；并行时由 --dist loadgroup 归到同一 worker",
]
# 标记名拼错必须报错，否则 @pytest.mark.slo 会静默失效 → 该排除的没排除 → 快速回路
# 越来越慢且没人发现
addopts = "--strict-markers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.blackboard", "core.browser"]
