<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工具行计时三态校验</title>
<link rel="stylesheet" href="../webui/dist/assets/index-BUcBWfXL.css">
<style>
  /* body 在 :root(=cyber-dark) 作用域外，产物 CSS 会把文字设成浅色 → 显式压回深色 */
  body { margin: 0; padding: 22px; background: #fff; color: #333;
         font-family: "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 3px; color: #222; }
  .sub { font-size: 11.5px; color: #888; margin-bottom: 16px; }
  .stage { padding: 14px; border-radius: 10px; background: var(--surface-0); border: 1px solid #ddd; }
  .stage + .stage { margin-top: 14px; }
  .cap { font-size: 11.5px; margin-bottom: 7px; color: #555; }
  .cap b { font-family: ui-monospace, monospace; }
  .rows { display: grid; gap: 2px; max-width: 760px; }
</style>
</head>
<body>
<h1>工具行计时三态 · 产物 CSS 校验</h1>
<div class="sub">同一条 <code>.wb-timeline</code> 里的两种状态：真在跑 = primary「已运行 Ns」；排在队里 = muted「排队中 Ns」</div>
<div id="out"></div>

<template id="row">
  <div class="rounded-md border border-border/50 bg-card/40">
    <button class="flex w-full items-center gap-2 px-2 py-1 text-left">
      <span class="shrink-0 text-primary">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" class="animate-spin">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
      </span>
      <span class="shrink-0 font-mono text-[11px] font-semibold text-foreground/85">kb_search</span>
      <span class="min-w-0 flex-1 truncate font-mono text-[10px] text-muted-foreground/70"></span>
      <span class="tm shrink-0 font-mono text-[9px]"></span>
    </button>
  </div>
</template>

<script>
  const CASES = [
    { theme: "light",     args: '{"query":"手册","limit":15}',        label: "已运行 38s", cls: "text-primary",
      note: "① 有 start 事件 → 真在跑" },
    { theme: "light",     args: '{"query":"ctf pwn web","limit":15}', label: "排队中 38s", cls: "text-muted-foreground",
      note: "② 无 start 事件、本轮仍在跑 → 排队（本次修复）" },
    { theme: "light",     args: '{"query":"orphan","limit":15}',      label: "运行中",      cls: "text-primary",
      note: "③ 无 start 事件、本轮已停（孤儿行）→ 维持原样，不编造时刻" },
    { theme: "warm-dark", args: '{"query":"手册","limit":15}',        label: "已运行 38s", cls: "text-primary",
      note: "warm-dark：已运行" },
    { theme: "warm-dark", args: '{"query":"ctf pwn web","limit":15}', label: "排队中 38s", cls: "text-muted-foreground",
      note: "warm-dark：排队中" },
  ]
  const out = document.getElementById("out")
  const tpl = document.getElementById("row")
  for (const c of CASES) {
    const stage = document.createElement("div")
    stage.className = "stage"
    stage.setAttribute("data-theme", c.theme)
    const cap = document.createElement("div")
    cap.className = "cap"
    cap.innerHTML = `<b>${c.theme}</b> · ${c.note}`
    stage.appendChild(cap)
    const rows = document.createElement("div")
    rows.className = "rows"
    const node = tpl.content.cloneNode(true)
    node.querySelectorAll("span")[2].textContent = c.args
    const tm = node.querySelector(".tm")
    tm.textContent = c.label
    tm.classList.add(...c.cls.split(" "))
    rows.appendChild(node)
    stage.appendChild(rows)
    out.appendChild(stage)
  }
</script>
</body>
</html>
