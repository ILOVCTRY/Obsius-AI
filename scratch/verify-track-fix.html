<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>场景方向选中态 · 修复校验（三主题）</title>
<link rel="stylesheet" href="../webui/dist/assets/index-OhJoHoi0.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 3px; color: #222; }
  .sub { font-size: 11.5px; color: #888; margin-bottom: 18px; }
  .row { margin-bottom: 26px; }
  .rowh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .rowh b { font-size: 12.5px; }
  .rowh span { font-size: 11px; color: #888; }
  /* 关键：stage 必须用该主题自己的页面底色，否则深色主题在白色底上校验会误判 */
  .stage { padding: 16px; border-radius: 12px; border: 1px solid #ddd; background: var(--surface-1); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
</style>
</head>
<body>
<h1>场景方向 · 选中态配色修复校验</h1>
<div class="sub">同一份产物 CSS 下，三个主题各渲染一次；选中项=第一张卡（渗透测试）</div>
<div id="out"></div>

<template id="tpl">
  <div class="grid">
    <button class="rounded-lg border px-3 py-3 text-left transition border-(--brand-border) bg-(--brand-bg)">
      <span class="block text-sm font-medium text-foreground">渗透测试</span>
      <span class="mt-1 block line-clamp-2 text-[11px] text-muted-foreground">授权渗透测试/SRC 漏洞挖掘：强角色分工、owner 规则与噪声预算、授权边界；验证上限=影响证明级（96.9）；收尾产物漏洞报告（verified 证据链）</span>
    </button>
    <button class="rounded-lg border px-3 py-3 text-left transition border-border hover:border-(--brand-border) hover:bg-(--brand-bg)">
      <span class="block text-sm font-medium text-foreground">红队行动</span>
      <span class="mt-1 block line-clamp-2 text-[11px] text-muted-foreground">目标导向攻击链模拟：信息收集、外网打点、内网渗透、提权、横向移动；ROE 四要素约束内允许长周期推进；收尾产物战果链报告</span>
    </button>
    <button class="rounded-lg border px-3 py-3 text-left transition border-border hover:border-(--brand-border) hover:bg-(--brand-bg)">
      <span class="block text-sm font-medium text-foreground">逆向分析</span>
      <span class="mt-1 block line-clamp-2 text-[11px] text-muted-foreground">通用逆向/样本研究工作台：headless 客观函数缓存 + func_kb 人机共写；收尾产物为研究笔记与可复现发现</span>
    </button>
  </div>
</template>

<template id="tpl-old">
  <div class="grid">
    <button class="rounded-lg border px-3 py-3 text-left transition border-cyan-300/60 bg-cyan-300/10 text-cyan-100">
      <span class="block text-sm font-medium">渗透测试</span>
      <span class="mt-1 block line-clamp-2 text-[11px] opacity-65">授权渗透测试/SRC 漏洞挖掘：强角色分工、owner 规则与噪声预算、授权边界；验证上限=影响证明级（96.9）</span>
    </button>
    <button class="rounded-lg border px-3 py-3 text-left transition border-white/10 text-muted-foreground">
      <span class="block text-sm font-medium">红队行动</span>
      <span class="mt-1 block line-clamp-2 text-[11px] opacity-65">目标导向攻击链模拟：信息收集、外网打点、内网渗透、提权、横向移动</span>
    </button>
    <button class="rounded-lg border px-3 py-3 text-left transition border-white/10 text-muted-foreground">
      <span class="block text-sm font-medium">逆向分析</span>
      <span class="mt-1 block line-clamp-2 text-[11px] opacity-65">通用逆向/样本研究工作台：headless 客观函数缓存 + func_kb 人机共写</span>
    </button>
  </div>
</template>

<script>
  const THEMES = [
    { id: "light",     label: "light（明亮，报告的问题）" },
    { id: "warm-dark", label: "warm-dark" },
    { id: "cyber-dark",label: "cyber-dark" },
  ]
  const out = document.getElementById("out")
  const tpl = document.getElementById("tpl")
  const tplOld = document.getElementById("tpl-old")

  // 修复前（仅 light）对照
  {
    const row = document.createElement("div")
    row.className = "row"
    row.innerHTML = `<div class="rowh"><b>修复前</b><span>light 主题 · 选中项文字 = text-cyan-100</span></div>`
    const stage = document.createElement("div")
    stage.className = "stage"
    stage.setAttribute("data-theme", "light")
    stage.appendChild(tplOld.content.cloneNode(true))
    row.appendChild(stage)
    out.appendChild(row)
  }

  for (const t of THEMES) {
    const row = document.createElement("div")
    row.className = "row"
    row.innerHTML = `<div class="rowh"><b>修复后</b><span>${t.label} · 选中 = border-(--brand-border) + bg-(--brand-bg)</span></div>`
    const stage = document.createElement("div")
    stage.className = "stage"
    stage.setAttribute("data-theme", t.id)
    stage.appendChild(tpl.content.cloneNode(true))
    row.appendChild(stage)
    out.appendChild(row)
  }
</script>
</body>
</html>
