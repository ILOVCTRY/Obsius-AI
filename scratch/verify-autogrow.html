<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>composer 输入框自适应高度校验</title>
<link rel="stylesheet" href="../webui/dist/assets/index-IhvQ4IiT.css">
<style>
  body { margin: 0; padding: 20px; background: #17151a; color: #ddd;
         font-family: "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { font-size: 11.5px; color: #8b8480; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
  .cell { }
  .cap { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 11px; }
  .cap b { color: #e08a5c; font-size: 12px; }
  .cap .h { margin-left: auto; font-family: ui-monospace, monospace; font-size: 11px; color: #7fd6b0; }
  .cap .h.clamp { color: #f0b23c; }
  .frame { width: 420px; }
</style>
</head>
<body>
<h1>composer 输入框自适应高度 · 产物 CSS 校验</h1>
<div class="sub">下限 rows=2 / 上限 180px；每格显示 textarea 实测高度（clamp 态标黄）</div>

<div class="grid" id="grid"></div>

<script>
  const CASES = [
    { n: 0,  label: "空（下限态）" },
    { n: 1,  label: "1 行" },
    { n: 3,  label: "3 行" },
    { n: 5,  label: "5 行" },
    { n: 8,  label: "8 行（≈上限）" },
    { n: 16, label: "16 行（超上限，内部滚动）" },
  ]
  const MAX = 180
  const grid = document.getElementById("grid")
  for (const c of CASES) {
    const cell = document.createElement("div")
    cell.className = "cell"
    const text = Array.from({ length: c.n }, (_, i) =>
      "尝试数量1111111111111111111111111111" + (i + 1)).join("\n")
    cell.innerHTML = `
      <div class="cap"><b>${c.label}</b><span>${c.n} 行内容</span><span class="h"></span></div>
      <div class="frame"><div class="wb-composer"><textarea rows="2" spellcheck="false"
        placeholder="描述测试意图，回车发送…"></textarea></div></div>`
    grid.appendChild(cell)
    const ta = cell.querySelector("textarea")
    ta.value = text
    // 与 AgentWorkbenchView 的 effect 完全同款
    ta.style.height = "auto"
    ta.style.height = `${Math.min(ta.scrollHeight, MAX)}px`
    const h = ta.getBoundingClientRect().height
    const lab = cell.querySelector(".h")
    lab.textContent = h.toFixed(1) + "px"
    if (ta.scrollHeight > MAX + 0.5) { lab.classList.add("clamp"); lab.textContent += " ⤓滚动" }
  }
</script>
</body>
</html>
