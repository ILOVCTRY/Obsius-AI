    <script>
      (() => {
        try {
          let theme = localStorage.getItem("ui.theme")
          // 旧版毛玻璃是独立主题 id="glass"——迁移为 cyber-dark + 玻璃质感模式
          if (theme === "glass") {
            theme = "cyber-dark"
            localStorage.setItem("ui.theme", theme)
            localStorage.setItem("ui.glass", "1")
          }
          if (theme === "cyber-dark" || theme === "warm-dark" || theme === "light"
              || theme === "rose-dark" || theme === "rose-light") {
            document.documentElement.dataset.theme = theme
          }
          if (localStorage.getItem("ui.glass") === "1") {
            document.documentElement.dataset.glass = "1"
          }
        } catch {}
      })()
    </script>
